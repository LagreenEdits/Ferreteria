server.port=8081

spring.datasource.url=jdbc:h2:mem:xorr;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT (solo desarrollo): el secreto debe tener al menos 32 caracteres.
# En producción se reemplaza por una variable de entorno, nunca se sube a GitHub.
xorr.jwt.secret=xorr-secreto-solo-para-desarrollo-cambiar-en-produccion
xorr.jwt.expiracion-minutos=480