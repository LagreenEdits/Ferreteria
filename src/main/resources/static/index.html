<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xorr · Sistema Gestor de Ferreterías</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --c:#E61E32;--cd:#B8141F;--tint:#fdecee;--tint2:#fff6f7;
  --bg:#f6f7f9;--card:#fff;--t:#111827;--m:#6b7280;--b:#e5e7eb;--b2:#f1d5d8;
  --ok:#15803d;--okbg:#dcfce7;--er:#b91c1c;--warn:#b45309;--warnbg:#fef3c7;
  --r:12px;--sh:0 1px 2px rgba(17,24,39,.05),0 4px 14px rgba(17,24,39,.04);
  --f:"Plus Jakarta Sans",system-ui,"Segoe UI",Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:5rem}
body{margin:0;font:15px/1.55 var(--f);background:var(--bg);color:var(--t);-webkit-font-smoothing:antialiased}
:focus-visible{outline:3px solid rgba(230,30,50,.35);outline-offset:2px}

/* Encabezado */
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--b);padding:.65rem 1.25rem;display:flex;gap:1rem;align-items:center}
.brand{display:flex;align-items:center;gap:.6rem;flex:1}
.logo{width:34px;height:34px;border-radius:9px;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:800;font-size:1.1rem;box-shadow:0 3px 8px rgba(230,30,50,.3)}
.brand b{font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;color:var(--m);font-size:.72rem;line-height:1;margin-top:2px;font-weight:500}
#quien{display:flex;align-items:center;gap:.6rem;font-size:.88rem;font-weight:600}
.av{width:32px;height:32px;border-radius:50%;background:var(--tint);color:var(--cd);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.rol{font-size:.72rem;font-weight:600;color:var(--m);display:block;line-height:1.1}
header button{background:#fff;color:var(--t);border-color:var(--b)}
header button:hover{background:var(--bg)}

/* Estructura */
main{max-width:none;width:100%;margin:1.5rem 0;padding:0 1.25rem;display:grid;grid-template-columns:200px minmax(0,1fr);gap:1.5rem;align-items:start}
nav{display:flex;flex-direction:column;gap:.25rem;position:sticky;top:5rem}
nav button{display:flex;align-items:center;gap:.65rem;width:100%;text-align:left;padding:.6rem .8rem;border:0;border-radius:10px;background:transparent;color:var(--t);font-weight:600;transition:background .15s,color .15s}
nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--m)}
nav button:hover{background:#fff}
nav button.on{background:var(--c);color:#fff;box-shadow:0 4px 12px rgba(230,30,50,.28)}
nav button.on svg{color:#fff}
nav button.on:hover{background:var(--cd)}
nav button *{pointer-events:none}

/* Tarjetas */
.card{background:var(--card);border:1px solid var(--b);border-radius:var(--r);padding:1.25rem;margin-bottom:1.1rem;box-shadow:var(--sh)}
h2{margin:0;font-size:1.1rem;font-weight:700;letter-spacing:-.01em}
.hint{margin:.2rem 0 1rem;color:var(--m);font-size:.88rem}
.card>h2+*{margin-top:.9rem}
.card>.hint{margin-top:.2rem}
.ch{display:flex;gap:1rem;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:.9rem}
.ch .hint{margin:.1rem 0 0}
.ch input{width:240px;max-width:100%}

/* Formularios */
label{display:block;font-size:.82rem;font-weight:600;color:#374151;margin:.7rem 0 .25rem}
input,select{width:100%;padding:.6rem .75rem;border:1px solid #d1d5db;border-radius:9px;font:inherit;background:#fff;color:var(--t);transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#9ca3af}
input:hover,select:hover{border-color:#9ca3af}
input:focus,select:focus{outline:0;border-color:var(--c);box-shadow:0 0 0 3px rgba(230,30,50,.15)}
select:disabled{background:#f3f4f6;color:var(--m);cursor:not-allowed}
.row{display:flex;gap:.8rem;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1;min-width:130px}
.row label{margin-top:0}

/* Botones */
button{padding:.55rem 1rem;border:1px solid var(--c);background:#fff;color:var(--c);border-radius:9px;font:inherit;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .05s}
button:hover{background:var(--tint)}
button:active{transform:translateY(1px)}
button.p{background:var(--c);color:#fff;box-shadow:0 2px 6px rgba(230,30,50,.25)}
button.p:hover{background:var(--cd);border-color:var(--cd)}
button.sm{padding:.3rem .65rem;font-size:.82rem}
button.g{border-color:var(--b);color:var(--t)}
button.g:hover{background:var(--bg)}
button.d{border-color:var(--b);color:var(--er)}
button.d:hover{background:#fef2f2;border-color:#fecaca}
.link{background:none;border:0;box-shadow:none;color:var(--c);padding:.3rem 0;font-weight:600}
.link:hover{background:none;text-decoration:underline}

/* Tablas */
.tw{overflow-x:auto;margin:0 -.25rem;padding:0 .25rem}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:.7rem .75rem;border-bottom:1px solid var(--b);white-space:nowrap}
th{font-size:.78rem;font-weight:600;color:var(--m);background:#f9fafb;border-top:1px solid var(--b)}
th:first-child{border-radius:8px 0 0 0}th:last-child{border-radius:0 8px 0 0}
td:first-child{white-space:normal;font-weight:600}
tr:last-child td{border-bottom:0}
tbody tr:hover td,table tr:hover td{background:var(--tint2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.low{color:var(--cd);font-weight:700}
.badge{display:inline-block;font-size:.7rem;font-weight:700;padding:.1rem .5rem;border-radius:999px;margin-left:.4rem;vertical-align:1px}
.badge.bad{background:var(--tint);color:var(--cd)}
.badge.rol-a{background:var(--warnbg);color:var(--warn);margin:0}
.badge.rol-e{background:#e0f2fe;color:#0369a1;margin:0}
.empty{text-align:center;color:var(--m);padding:2rem 1rem;border:1px dashed var(--b);border-radius:10px;background:#fafafa}
.empty b{display:block;color:var(--t);margin-bottom:.2rem}

/* Venta */
.tot{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-top:1rem;padding:1rem 1.1rem;border-radius:10px;background:var(--tint);border:1px solid var(--b2)}
.tot span{color:var(--m);font-size:.85rem;display:block;line-height:1.2}
.tot strong{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.tot button{padding:.7rem 1.4rem;font-size:1rem}

/* Acceso */
body.noauth{min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:linear-gradient(160deg,var(--tint) 0%,#fff 55%) fixed no-repeat}
.auth{width:100%;max-width:400px;margin:0;padding:1.75rem;box-shadow:0 10px 40px rgba(17,24,39,.08)}
.auth .brand{flex:none;margin-bottom:1.2rem}
.auth .lead{color:var(--m);font-size:.9rem;margin:0 0 .4rem}
.auth h2{font-size:1.3rem}
.auth .acts{display:flex;flex-direction:column;gap:.5rem;margin-top:1.2rem}
.auth .acts .p{width:100%;padding:.7rem}
.auth .acts .link{text-align:center}

/* Detalle desplegable y estados */
.det td{background:#fafafa;white-space:normal;font-weight:400;padding:.4rem .75rem .9rem 1.5rem}
.det table{margin:0}.det th{background:transparent;border-top:0}
.badge.st-p{background:var(--warnbg);color:var(--warn);margin:0}
.badge.st-r{background:var(--okbg);color:var(--ok);margin:0}
.badge.st-c{background:#f3f4f6;color:var(--m);margin:0}
button.x{background:none;border:0;box-shadow:none;color:var(--c);padding:.2rem .4rem;font-weight:700}
button.x:hover{background:none;text-decoration:underline}

/* Inicio y detalles de interfaz */
.hello h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.hello p{margin:.15rem 0 1.1rem;color:var(--m);font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:.9rem;margin-bottom:1.1rem}
.stat{display:flex;flex-direction:column;align-items:flex-start;gap:.1rem;text-align:left;padding:1rem 1.1rem;border:1px solid var(--b);border-radius:var(--r);background:#fff;color:var(--t);box-shadow:var(--sh)}
button.stat{font-weight:400}
.stat[data-go]{cursor:pointer}
.stat[data-go]:hover{border-color:var(--c);background:var(--tint2)}
.stat *{pointer-events:none}
.stat small{color:var(--m);font-weight:600;font-size:.78rem}
.stat strong{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;line-height:1.25}
.stat em{font-style:normal;color:var(--m);font-size:.8rem}
.stat.alert strong{color:var(--cd)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:1.1rem;align-items:start}
.cols .card{margin-bottom:0}
.acts-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.1rem}
.ok-card{border-color:#bbf7d0;background:#f0fdf4}
.chk{display:flex;gap:.5rem;align-items:center;font-weight:500;margin:.5rem 0 0;cursor:pointer}
.chk input{width:auto;margin:0}
.cargando{text-align:center;color:var(--m)}

/* Validación */
.err{display:block;color:var(--er);font-size:.78rem;font-weight:600;margin-top:.25rem;white-space:normal}
input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--er);box-shadow:0 0 0 3px rgba(185,28,28,.12)}

/* Aviso */
#msg{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);padding:.75rem 1.1rem;border-radius:10px;color:#fff;display:none;max-width:90%;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:50}
[hidden]{display:none!important}

@media (max-width:780px){
  main{grid-template-columns:1fr;gap:1rem;margin-top:1rem}
  nav{flex-direction:row;overflow-x:auto;position:static;padding-bottom:.25rem;gap:.4rem}
  nav button{width:auto;white-space:nowrap;background:#fff;border:1px solid var(--b)}
  nav button.on{border-color:var(--c)}
  .brand small,.rol{display:none}
  .ch input{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="noauth">
<div id="auth" class="card auth">
  <div class="brand"><div class="logo">X</div><div><b>Xorr</b><small>Sistema gestor de ferreterías</small></div></div>
  <h2 id="auth-t">Iniciar sesión</h2>
  <p class="lead" id="auth-l">Entra para ver tu inventario, vender y consultar facturas.</p>
  <div id="f-reg" hidden>
    <label for="r-emp">Nombre de la ferretería</label><input id="r-emp" maxlength="255" placeholder="Ej: Ferretería El Tornillo" autocomplete="organization">
    <label for="r-nom">Tu nombre</label><input id="r-nom" maxlength="255" placeholder="Ej: Ana Gómez" autocomplete="name">
  </div>
  <label for="a-cor">Correo</label><input id="a-cor" type="email" maxlength="255" placeholder="tucorreo@ejemplo.com" autocomplete="email">
  <label for="a-pas">Contraseña</label><input id="a-pas" type="password" maxlength="72" placeholder="8 a 72 caracteres" autocomplete="current-password">
  <label class="chk" for="a-ver"><input type="checkbox" id="a-ver"> Mostrar contraseña</label>
  <div class="acts">
    <button class="p" id="a-go">Entrar</button>
    <button class="link" id="a-sw">Registrar mi ferretería</button>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="brand"><div class="logo">X</div><div><b id="h-emp">Xorr</b><small id="h-sub">Gestor de ferreterías</small></div></div>
    <div id="quien"></div>
    <button id="salir">Cerrar sesión</button>
  </header>
  <main>
    <nav id="nav"></nav>
    <section id="v"></section>
  </main>
</div>
<div id="msg" role="status" aria-live="polite"></div>

<script>
"use strict";
var token = null, user = null, vista = "productos", lineas = [], prods = [], editando = null,
    provs = [], edProv = null, edAso = null, lineasC = [], compraProv = "",
    empresa = "", ultima = null, listaFact = [], listaOrd = [], nprovG = {};
var $ = function (id) { return document.getElementById(id); };
var money = new Intl.NumberFormat("es-CO", { style: "currency", currency: "COP", minimumFractionDigits: 2, maximumFractionDigits: 2 });
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function aviso(t, ok) { var m = $("msg"); m.textContent = (ok ? "✓ " : "⚠ ") + t; m.style.background = ok ? "var(--ok)" : "var(--er)"; m.style.display = "block"; clearTimeout(aviso.t); aviso.t = setTimeout(function () { m.style.display = "none"; }, 3500); }
function guardar() { try { sessionStorage.setItem("xorr", JSON.stringify({ token: token, user: user })); } catch (e) { } }
function esAdmin() { return user && user.rol === "ADMIN"; }

async function api(ruta, metodo, cuerpo) {
  var h = { "Content-Type": "application/json" };
  if (token) h.Authorization = "Bearer " + token;
  var r = await fetch(ruta, { method: metodo || "GET", headers: h, body: cuerpo ? JSON.stringify(cuerpo) : undefined });
  var d = null;
  try { d = await r.json(); } catch (e) { }
  if (r.status === 401 && token && ruta.indexOf("/api/auth/") < 0) { salir(); throw new Error("Tu sesión terminó, entra de nuevo"); }
  if (!r.ok) throw new Error((d && d.mensaje) || "Error " + r.status);
  return d;
}
/* El backend no devuelve el nombre de la empresa: se recuerda en este navegador al registrarla */
function mapaEmp() { try { return JSON.parse(localStorage.getItem("xorr_emp") || "{}"); } catch (e) { return {}; } }
function recordarEmp(correo, nombre) {
  try { var m = mapaEmp(); m[String(correo).trim().toLowerCase()] = nombre; localStorage.setItem("xorr_emp", JSON.stringify(m)); } catch (e) { }
}
function pintarEncabezado() {
  $("h-emp").textContent = empresa || "Xorr";
  $("h-sub").textContent = empresa ? "Xorr · Gestor de ferreterías" : "Gestor de ferreterías";
  document.title = (empresa ? empresa + " · " : "") + "Xorr";
}
async function intentar(fn) { try { await fn(); } catch (e) { aviso(e.message, false); } }

/* ---------- Validación: mismas reglas que los DTO del backend ----------
   Obligatorios (@NotBlank/@NotNull), correo (@Email), contraseña 8-72 (@Size),
   precios >= 0 (@DecimalMin), stock >= 0 y cantidades >= 1 (@Min), enteros (Integer).
   El servidor sigue validando: esto solo evita viajes inútiles y da mensajes junto al campo. */
var INT_MAX = 2147483647, PRECIO_MAX = 999999999999;
var Val = {
  req: function (v, msg) { return String(v == null ? "" : v).trim() ? null : msg; },
  nombre: function (v, msg) { var t = String(v == null ? "" : v).trim(); return !t ? msg : (t.length > 255 ? "Máximo 255 caracteres" : null); },
  texto255: function (v) { return String(v == null ? "" : v).trim().length > 255 ? "Máximo 255 caracteres" : null; },
  correo: function (v) {
    var t = String(v == null ? "" : v).trim();
    if (!t) return "El correo es obligatorio";
    return (/^[^\s@]+@[^\s@]+$/.test(t) && t.length <= 255) ? null : "El correo no es válido";
  },
  clave: function (v) {
    v = String(v == null ? "" : v);
    if (!v.trim()) return "La contraseña es obligatoria";
    return (v.length < 8 || v.length > 72) ? "La contraseña debe tener entre 8 y 72 caracteres" : null;
  },
  precio: function (txt, msgReq, msgNeg) {
    var t = String(txt == null ? "" : txt).trim();
    if (!t) return msgReq;
    var n = numPrecio(t);
    if (!isFinite(n)) return "Escribe un precio válido";
    if (n < 0) return msgNeg;
    return n > PRECIO_MAX ? "El precio es demasiado grande" : null;
  },
  entero: function (txt, msgReq, msgMin, min) {
    var t = String(txt == null ? "" : txt).trim();
    if (!t) return msgReq;
    var n = Number(t);
    if (!isFinite(n) || Math.floor(n) !== n) return "Escribe un número entero, sin decimales";
    if (n < min) return msgMin;
    return n > INT_MAX ? "El valor es demasiado grande" : null;
  }
};
function limpiarErrores(raiz) {
  Array.prototype.forEach.call(raiz.querySelectorAll(".err"), function (e) { e.remove(); });
  Array.prototype.forEach.call(raiz.querySelectorAll("[aria-invalid]"), function (e) { e.removeAttribute("aria-invalid"); });
}
/* reglas: [[idDelCampo, mensajeOnull], ...]. Marca todos los campos con error y enfoca el primero. */
function validar(raiz, reglas) {
  limpiarErrores(raiz);
  var primero = null;
  reglas.forEach(function (r) {
    if (!r[1]) return;
    var el = $(r[0]), m = document.createElement("small");
    el.setAttribute("aria-invalid", "true");
    m.className = "err"; m.setAttribute("role", "alert"); m.textContent = r[1];
    el.insertAdjacentElement("afterend", m);
    if (!primero) primero = { el: el, msg: r[1] };
  });
  if (!primero) return true;
  primero.el.focus(); aviso(primero.msg, false);
  return false;
}
/* El error del campo desaparece cuando la persona lo corrige */
function quitarError(e) {
  var el = e.target;
  if (!el.getAttribute || el.getAttribute("aria-invalid") !== "true") return;
  el.removeAttribute("aria-invalid");
  var n = el.nextElementSibling;
  if (n && n.classList.contains("err")) n.remove();
}
document.addEventListener("input", quitarError);
document.addEventListener("change", quitarError);
/* Campos numéricos: sin signo, punto, coma ni exponente. Enter confirma en formularios y líneas. */
var ENTER = { "p-nom": "p-ok", "p-pre": "p-ok", "p-sto": "p-ok", "p-min": "p-ok", "pv-nom": "pv-ok", "pv-tel": "pv-ok", "as-pre": "as-ok", "u-nom": "u-ok", "u-cor": "u-ok", "u-pas": "u-ok", "e-nom": "e-ok" };
document.addEventListener("keydown", function (e) {
  if (e.target.type === "number" && ["e", "E", "+", "-", ".", ","].indexOf(e.key) >= 0) e.preventDefault();
  if (e.key !== "Enter") return;
  if (e.target.id === "v-can") { e.preventDefault(); agregarLinea(); }
  else if (e.target.id === "c-can") { e.preventDefault(); agregarLineaC(); }
  else if (ENTER[e.target.id]) { e.preventDefault(); $(ENTER[e.target.id]).click(); }
});

/* ---------- Acceso ---------- */
var registrando = false;
$("a-sw").onclick = function () {
  registrando = !registrando;
  $("f-reg").hidden = !registrando;
  $("auth-t").textContent = registrando ? "Registrar mi ferretería" : "Iniciar sesión";
  $("auth-l").textContent = registrando ? "Crea la cuenta de administrador de tu ferretería." : "Entra para ver tu inventario, vender y consultar facturas.";
  $("a-go").textContent = registrando ? "Registrar y entrar" : "Entrar";
  $("a-sw").textContent = registrando ? "Ya tengo cuenta" : "Registrar mi ferretería";
  $("a-pas").autocomplete = registrando ? "new-password" : "current-password";
  limpiarErrores($("auth"));
};
$("a-ver").onchange = function () { $("a-pas").type = this.checked ? "text" : "password"; };
$("auth").onkeydown = function (e) { if (e.key === "Enter" && e.target.tagName === "INPUT") $("a-go").click(); };
$("a-go").onclick = function () {
  intentar(async function () {
    var correo = $("a-cor").value.trim(), password = $("a-pas").value;
    var reglas = registrando
      ? [["r-emp", Val.nombre($("r-emp").value, "El nombre de la empresa es obligatorio")], ["r-nom", Val.nombre($("r-nom").value, "El nombre es obligatorio")], ["a-cor", Val.correo(correo)], ["a-pas", Val.clave(password)]]
      : [["a-cor", Val.req(correo, "El correo es obligatorio")], ["a-pas", Val.req(password, "La contraseña es obligatoria")]];
    if (!validar($("auth"), reglas)) return;
    if (registrando) {
      await api("/api/auth/registro-admin", "POST", { nombreEmpresa: $("r-emp").value.trim(), nombre: $("r-nom").value.trim(), correo: correo, password: password });
      recordarEmp(correo, $("r-emp").value.trim());
    }
    var d = await api("/api/auth/login", "POST", { correo: correo, password: password });
    token = d.token; user = d.usuario; guardar(); entrar();
  });
};
function entrar() {
  document.body.classList.remove("noauth");
  $("auth").hidden = true; $("app").hidden = false;
  var ini = (user.nombre || "?").trim().charAt(0).toUpperCase();
  $("quien").innerHTML = '<span class="av">' + esc(ini) + '</span><span>' + esc(user.nombre) + '<span class="rol">' + (esAdmin() ? "Administrador" : "Empleado") + "</span></span>";
  empresa = mapaEmp()[String(user.correo || "").toLowerCase()] || ""; pintarEncabezado();
  vista = "inicio"; menu(); ir("inicio");
}
function salir() {
  token = null; user = null; lineas = []; lineasC = []; compraProv = ""; editando = null; edProv = null; edAso = null; empresa = ""; ultima = null; listaFact = []; listaOrd = []; pintarEncabezado();
  try { sessionStorage.removeItem("xorr"); } catch (e) { }
  document.body.classList.add("noauth");
  $("app").hidden = true; $("auth").hidden = false; $("a-pas").value = "";
}
$("salir").onclick = salir;

/* ---------- Menú ---------- */
var ICO = {
  inicio: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  productos: '<path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/>',

function fmtPrecio(raw) {

  return dec === null ? ent : ent + "," + dec;
}

async function pVender() {
  prods = (await api("/api/productos")).filter(function (x) { return x.stock > 0; });
  $("v").innerHTML = (ultima ? '<div class="card ok-card"><h2>✓ Venta registrada: factura #' + ultima.id + '</h2><p class="hint">Total ' + money.format(ultima.total) + '. Ya puedes entregarle la factura al cliente.</p><button class="p" data-pf="' + ultima.id + '">Descargar factura en PDF</button></div>' : "") +
    '<div class="card"><h2>Nueva venta</h2><p class="hint">Elige un producto, indica la cantidad y agrégalo al detalle.</p>' +
    (prods.length ? '<div class="row"><div style="flex:3"><label for="v-pro">Producto</label><select id="v-pro">' +
    prods.map(function (x) { return '<option value="' + x.id + '">' + esc(x.nombre) + " (stock " + x.stock + ")</option>"; }).join("") +

    : '<div class="empty"><b>No hay productos con stock</b>Agrega o repón productos para poder vender.</div>') + '</div>' +
    '<div class="card"><h2>Detalle de la venta</h2><div id="v-lin"></div></div>';

}
function agregarLinea() {
  var id = Number($("v-pro").value), can = Number($("v-can").value);
  var p = prods.filter(function (x) { return x.id === id; })[0];
  if (!p) { validar($("v"), [["v-pro", "Elige un producto"]]); return; }
  var l = lineas.filter(function (x) { return x.id === id; })[0];
  var libre = p.stock - (l ? l.cantidad : 0);
  var err = Val.entero($("v-can").value, "La cantidad es obligatoria", "La cantidad debe ser mayor que cero", 1);
  if (!err && can > libre) err = libre > 0 ? "Solo quedan " + libre + " unidades disponibles de " + p.nombre : "Ya agregaste todo el stock disponible de " + p.nombre;
  if (!validar($("v"), [["v-can", err]])) return;
  if (l) l.cantidad += can; else lineas.push({ id: id, nombre: p.nombre, precio: p.precioVenta, cantidad: can });
  pintarLineas();
}
function pintarLineas() {
  var total = 0;
  var filas = lineas.map(function (l, i) {
    var s = l.precio * l.cantidad; total += s;
    return "<tr><td>" + esc(l.nombre) + '</td><td class="n">' + l.cantidad + '</td><td class="n">' + money.format(s) + '</td><td class="n"><button class="sm d" data-q="' + i + '">Quitar</button></td></tr>';
  });
  $("v-lin").innerHTML = tabla([["Producto"], ["Cant.", "n"], ["Subtotal", "n"], ["", "n"]], filas, "Agrega productos para armar la venta.") +
    (lineas.length ? '<div class="tot"><div><span>Total a cobrar</span><strong>' + money.format(total) + '</strong></div><button class="p" id="v-ok">Registrar venta</button></div>' : "");
}
function vender() {
  if (!lineas.length) { aviso("La factura debe tener al menos un producto", false); return; }
  intentar(async function () {
    var f = await api("/api/facturas", "POST", { detalles: lineas.map(function (l) { return { idProducto: l.id, cantidad: l.cantidad }; }) });
    lineas.forEach(function (l) { nombres[l.id] = l.nombre; });
    lineas = []; ultima = f; aviso("Venta registrada: factura " + f.id + " por " + money.format(f.total), true); await pVender();
  });
}

function bajarPdf(archivo, bytes) {

  setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
}
function estadoTxt(e) { return e === "PENDIENTE" ? "Pendiente" : e === "RECIBIDA" ? "Recibida" : "Cancelada"; }
function filasPdf(ds) { return ds.map(function (d) { return [nombreProd(d.idProducto), String(d.cantidad), money.format(d.precioUnitario), money.format(d.subtotal)]; }); }
function pdfFactura(f) {

    columnas: ["Producto", "Cant.", "Precio unit.", "Subtotal"], filas: filasPdf(f.detalles), total: money.format(f.total) }));

}

    columnas: ["Producto", "Cant.", "Precio unit.", "Subtotal"], filas: filasPdf(o.detalles), total: money.format(o.total) }));

/* ---------- Inicio ---------- */
function stat(etiqueta, valor, sub, ir, alerta) {
  var c = "stat" + (alerta ? " alert" : ""), cuerpo = "<small>" + etiqueta + "</small><strong>" + valor + "</strong><em>" + sub + "</em>";
  return ir ? '<button class="' + c + '" data-go="' + ir + '">' + cuerpo + "</button>" : '<div class="' + c + '">' + cuerpo + "</div>";
}
async function pInicio() {
  var pedir = [api("/api/productos"), api("/api/facturas")];
  if (esAdmin()) pedir.push(api("/api/ordenes-compra"));
  var r = await Promise.all(pedir), ps = r[0], fs = r[1], os = r[2] || [];

  var hoy = new Date().toDateString();
  var deHoy = fs.filter(function (f) { return new Date(f.fecha).toDateString() === hoy; });

  var bajos = ps.filter(function (p) { return p.stock < p.stockMinimo; }).sort(function (a, b) { return (a.stock - a.stockMinimo) - (b.stock - b.stockMinimo); });
  var pend = os.filter(function (o) { return o.estado === "PENDIENTE"; }).length;
  var h = new Date().getHours(), saludo = h < 12 ? "Buenos días" : h < 19 ? "Buenas tardes" : "Buenas noches";

  var pide = (esAdmin() && !empresa)
    ? '<div class="card"><h2>¿Cómo se llama tu ferretería?</h2><p class="hint">Aparecerá en el encabezado y en las facturas en PDF. Se guarda en este navegador.</p><div class="row"><div style="flex:3"><label for="e-nom">Nombre de la ferretería</label><input id="e-nom" maxlength="255" placeholder="Ej: Ferretería El Tornillo"></div><div style="flex:none"><button class="p" id="e-ok">Guardar nombre</button></div></div></div>' : "";
  var ult = fs.slice(-5).reverse().map(function (f) {
    return "<tr><td>#" + f.id + "</td><td>" + esc(new Date(f.fecha).toLocaleString("es-CO", { dateStyle: "short", timeStyle: "short" })) + '</td><td class="n"><strong>' + money.format(f.total) + '</strong></td><td class="n"><button class="x" data-pf="' + f.id + '">PDF</button></td></tr>';
  });
  $("v").innerHTML = '<div class="hello"><h1>' + saludo + (nombre ? ", " + esc(nombre) : "") + ' 👋</h1><p>' + esc(fecha) + (empresa ? " · " + esc(empresa) : "") + "</p></div>" + pide +
    '<div class="stats">' +
    stat("Ventas de hoy", money.format(totHoy), deHoy.length + (deHoy.length === 1 ? " factura" : " facturas"), "facturas") +
    stat("Productos", ps.length, "en el inventario", "productos") +
    stat("Stock bajo", bajos.length, bajos.length ? "Conviene reponer" : "Todo en orden", "bajo", bajos.length > 0) +
    (esAdmin() ? stat("Órdenes pendientes", pend, "por recibir", "compras") : "") + "</div>" +
    '<div class="acts-row"><button class="p" data-go="vender">+ Nueva venta</button>' + (esAdmin() ? '<button data-go="productos">Agregar producto</button><button data-go="compras">Nueva orden de compra</button>' : "") + "</div>" +
    '<div class="cols"><div class="card"><h2>Últimas facturas</h2><p class="hint">Las 5 ventas más recientes.</p>' +
    tabla([["N.º"], ["Fecha"], ["Total", "n"], ["", "n"]], ult, "Cuando registres una venta aparecerá aquí.") + "</div>" +
    '<div class="card"><h2>Para reponer</h2><p class="hint">Productos por debajo de su mínimo.</p>' +
    tabla([["Producto"], ["Stock", "n"], ["Mínimo", "n"]], bajos.slice(0, 5).map(function (x) {
      return "<tr><td>" + esc(x.nombre) + '</td><td class="n low">' + x.stock + '</td><td class="n">' + x.stockMinimo + "</td></tr>";
    }), "Todo en orden: nada por debajo de su mínimo.") + "</div></div>";
}

/* ---------- Asociaciones proveedor-producto (solo ADMIN) ---------- */

}
async function pAsociaciones() {

  datosAso = r[0]; provs = r[1]; prods = r[2];
  nombres = {}; prods.forEach(function (p) { nombres[p.id] = p.nombre; });
  var nprov = {}; provs.forEach(function (p) { nprov[p.id] = p.nombre; });
  var a = edAso || { idProveedor: "", idProducto: "", precioCompra: "" };
  var form = (provs.length && prods.length)
    ? '<div class="row"><div><label for="as-prv">Proveedor</label><select id="as-prv"' + (edAso ? " disabled" : "") + ">" + opciones(provs, a.idProveedor) + "</select></div>" +
      '<div><label for="as-pro">Producto</label><select id="as-pro"' + (edAso ? " disabled" : "") + ">" + opciones(prods, a.idProducto) + "</select></div>" +
      '<div><label for="as-pre">Precio de compra</label><input id="as-pre" type="text" inputmode="decimal" maxlength="20" autocomplete="off" placeholder="0" value="' + (a.precioCompra === "" ? "" : esc(new Intl.NumberFormat("es-CO", { maximumFractionDigits: 2 }).format(a.precioCompra))) + '"></div>' +
      '<div style="flex:none"><button class="p" id="as-ok">Guardar asociación</button> ' + (edAso ? '<button class="g" id="as-no">Cancelar</button>' : "") + "</div></div>"
    : '<div class="empty"><b>Faltan datos</b>Necesitas al menos un proveedor y un producto para crear una asociación.</div>';
  $("v").innerHTML = '<div class="card"><h2>' + (edAso ? "Editar precio de compra" : "Nueva asociación") + '</h2><p class="hint">Indica qué productos vende cada proveedor y a qué precio. Solo estos productos se pueden pedir en una orden de compra.</p>' + form + "</div>" +
    '<div class="card"><h2>Asociaciones (' + datosAso.length + ')</h2><p class="hint">Cada proveedor y producto pueden asociarse una sola vez; para cambiar el precio, edita la asociación.</p>' +
    tabla([["Proveedor"], ["Producto"], ["Precio de compra", "n"], ["", "n"]], datosAso.map(function (x) {
      return "<tr><td>" + esc(nprov[x.idProveedor] || "#" + x.idProveedor) + "</td><td>" + esc(nombres[x.idProducto] || "#" + x.idProducto) + '</td><td class="n">' + money.format(x.precioCompra) +
        '</td><td class="n"><button class="sm" data-ae="' + x.id + '">Editar</button> <button class="sm d" data-ad="' + x.id + '">Eliminar</button></td></tr>';

}
function guardarAsociacion() {
  intentar(async function () {
    var idPv = Number(edAso ? edAso.idProveedor : $("as-prv").value), idPr = Number(edAso ? edAso.idProducto : $("as-pro").value);
    var repetida = !edAso && datosAso.some(function (x) { return x.idProveedor === idPv && x.idProducto === idPr; });
    if (!validar($("v"), [
      ["as-prv", idPv ? null : "El proveedor es obligatorio"],
      ["as-pro", !idPr ? "El producto es obligatorio" : (repetida ? "Ya existe esa asociación" : null)],

    var c = { idProveedor: idPv, idProducto: idPr, precioCompra: numPrecio($("as-pre").value) };

/* ---------- Compras: órdenes de compra (solo ADMIN) ---------- */
var asoC = [];
async function pCompras() {
  var r = await Promise.all([api("/api/ordenes-compra"), api("/api/proveedores"), api("/api/proveedor-productos"), api("/api/productos")]);
  var ords = r[0]; provs = r[1]; asoC = r[2]; prods = r[3];
  nombres = {}; prods.forEach(function (p) { nombres[p.id] = p.nombre; });
  var nprov = {}; provs.forEach(function (p) { nprov[p.id] = p.nombre; });
  nprovG = nprov; listaOrd = ords;
  if (!provs.some(function (p) { return String(p.id) === String(compraProv); })) compraProv = provs.length ? String(provs[0].id) : "";
  detalles = {}; ords.forEach(function (o) { detalles["o" + o.id] = o.detalles; });
  var form;
  if (!provs.length) form = '<div class="empty"><b>No hay proveedores</b>Crea un proveedor y asócialo a productos para poder pedir.</div>';
  else {
    var disp = asoC.filter(function (a) { return String(a.idProveedor) === compraProv; });
    form = '<div class="row"><div><label for="c-prv">Proveedor</label><select id="c-prv">' + opciones(provs, compraProv) + "</select></div>" +
      (disp.length
        ? '<div style="flex:2"><label for="c-pro">Producto</label><select id="c-pro">' + disp.map(function (a) { return '<option value="' + a.idProducto + '">' + esc(nombres[a.idProducto] || "#" + a.idProducto) + " (" + money.format(a.precioCompra) + ")</option>"; }).join("") + "</select></div>" +
          '<div><label for="c-can">Cantidad</label><input id="c-can" type="number" min="1" max="2147483647" step="1" value="1"></div><div style="flex:none"><button class="p" id="c-add">Agregar</button></div>'
        : '<div style="flex:3"><div class="empty" style="padding:.7rem"><b>Este proveedor no tiene productos asociados</b>Asócialos en la pestaña Asociaciones.</div></div>') + "</div>";
  }
  $("v").innerHTML = '<div class="card"><h2>Nueva orden de compra</h2><p class="hint">Solo se pueden pedir productos asociados al proveedor. El precio sale de la asociación.</p>' + form + '<div id="c-lin"></div></div>' +
    '<div class="card"><h2>Órdenes de compra (' + ords.length + ')</h2><p class="hint">Al recibir una orden el stock aumenta; una orden recibida no se puede revertir ni cancelar.</p>' +
    tabla([["N.º"], ["Fecha"], ["Proveedor"], ["Estado"], ["Total", "n"], ["", "n"]], ords.slice().reverse().map(function (o) {
      var cl = o.estado === "PENDIENTE" ? "st-p" : o.estado === "RECIBIDA" ? "st-r" : "st-c";
      var tx = o.estado === "PENDIENTE" ? "Pendiente" : o.estado === "RECIBIDA" ? "Recibida" : "Cancelada";
      return "<tr><td>#" + o.id + "</td><td>" + esc(new Date(o.fecha).toLocaleString("es-CO")) + "</td><td>" + esc(nprov[o.idProveedor] || "#" + o.idProveedor) + '</td><td><span class="badge ' + cl + '">' + tx + '</span></td><td class="n"><strong>' + money.format(o.total) + '</strong></td><td class="n">' +
        '<button class="x" data-od="' + o.id + '">Ver detalle</button> <button class="x" data-po="' + o.id + '">PDF</button>' +
        (o.estado === "PENDIENTE" ? ' <button class="sm" data-cr="' + o.id + '">Recibir</button> <button class="sm d" data-cc="' + o.id + '">Cancelar</button>' : "") + "</td></tr>";
    }), "Todavía no hay órdenes de compra.") + "</div>";
  pintarLineasC();
}
function agregarLineaC() {
  var id = Number($("c-pro").value), can = Number($("c-can").value);
  var a = asoC.filter(function (x) { return String(x.idProveedor) === compraProv && x.idProducto === id; })[0];
  if (!a) { validar($("v"), [["c-pro", "Elige un producto asociado al proveedor"]]); return; }
  var l = lineasC.filter(function (x) { return x.id === id; })[0];
  var err = Val.entero($("c-can").value, "La cantidad es obligatoria", "La cantidad debe ser mayor que cero", 1);
  if (!err && l && l.cantidad + can > INT_MAX) err = "El valor es demasiado grande";
  if (!validar($("v"), [["c-can", err]])) return;
  if (l) l.cantidad += can; else lineasC.push({ id: id, nombre: nombres[id] || "#" + id, precio: a.precioCompra, cantidad: can });
  pintarLineasC();
}
function pintarLineasC() {
  var cont = $("c-lin"); if (!cont) return;
  var total = 0;
  var filas = lineasC.map(function (l, i) {
    var s = l.precio * l.cantidad; total += s;
    return "<tr><td>" + esc(l.nombre) + '</td><td class="n">' + l.cantidad + '</td><td class="n">' + money.format(l.precio) + '</td><td class="n">' + money.format(s) + '</td><td class="n"><button class="sm d" data-cq="' + i + '">Quitar</button></td></tr>';
  });
  cont.innerHTML = '<div style="margin-top:1rem"></div>' + tabla([["Producto"], ["Cant.", "n"], ["Precio unit.", "n"], ["Subtotal", "n"], ["", "n"]], filas, "Agrega productos para armar la orden.") +
    (lineasC.length ? '<div class="tot"><div><span>Total de la orden</span><strong>' + money.format(total) + '</strong></div><button class="p" id="c-ok">Crear orden</button></div>' : "");
}
function crearOrden() {
  if (!compraProv) { aviso("El proveedor es obligatorio", false); return; }
  if (!lineasC.length) { aviso("La orden debe tener al menos un producto", false); return; }
  intentar(async function () {
    var o = await api("/api/ordenes-compra", "POST", { idProveedor: Number(compraProv), detalles: lineasC.map(function (l) { return { idProducto: l.id, cantidad: l.cantidad }; }) });
    lineasC = []; aviso("Orden #" + o.id + " creada por " + money.format(o.total), true); await pCompras();
  });
}
